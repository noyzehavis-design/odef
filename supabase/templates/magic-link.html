<!-- Supabase → Authentication → Emails → Magic Link. Subject: הקישור שלך לעודף ✨ -->
<div dir="rtl" style="font-family: Arial, sans-serif; text-align: right; line-height: 1.6">
  <h2 style="margin: 0 0 12px">היי 👋</h2>
  <p>הנה הקישור לכניסה לעודף:</p>
  <p>
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
      style="display: inline-block; background: #7c6cff; color: #fff; padding: 12px 24px; border-radius: 14px; text-decoration: none; font-weight: bold"
      >כניסה לעודף</a
    >
  </p>
  <p>או הקלידו באפליקציה את הקוד:</p>
  <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold" dir="ltr">{{ .Token }}</p>
  <p style="color: #888; font-size: 13px">לא ביקשתם להיכנס? אפשר להתעלם מהמייל הזה.</p>
</div>
